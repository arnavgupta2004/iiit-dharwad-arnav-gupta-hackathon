# MCC (merchant category code) -> GICS sector, used to seed synthetic corporate obligors
# for the Module B wholesale book from the Kaggle "Financial Transactions Dataset"
# (computingvictor/transactions-fraud-datasets). All 109 MCCs present in that dataset's
# mcc_codes.json are mapped. Mapping is Arnav's judgement call (see docs/ASSUMPTIONS.md).
# Sector names match configs/universe.yaml and the SPDR sector ETF proxies (XL*).

sector_etf:
  Industrials: XLI
  Materials: XLB
  Information Technology: XLK
  Communication Services: XLC
  Consumer Discretionary: XLY
  Consumer Staples: XLP
  Health Care: XLV
  Financials: XLF
  Utilities: XLU
  Energy: XLE
  Real Estate: XLRE

