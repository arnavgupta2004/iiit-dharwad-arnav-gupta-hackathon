# Module B: strategic stress testing of a synthetic wholesale-banking book (spec §7).

trigger:
  min_impact: 8                 # "Impact > 7" in the brief
  min_event_confidence: 0.6
  min_sources: 2
  cooldown_hours: 24            # per (event_class, region)

portfolio:
  seed: 20261001
  n_positions_target: 350
  total_exposure_usd: 10.0e9
  base_currency: USD
  mix:                          # share of exposure by asset class
    loan: 0.45
    bond: 0.30
    derivative: 0.15            # notional-equivalent
    equity: 0.10
  transactions_source: computingvictor/transactions-fraud-datasets
  transactions_zip: data/raw/_downloads/kaggle/transactions-fraud-datasets.zip
  counterparty_prefix: CP_
  as_of: "2021-09-30"             # pricing date = start of the replay window
  n_obligors: 120
  min_obligors_per_sector: 3
  min_merchant_months: 24         # need enough history for a flow-volatility estimate
  # Target rating mix of the obligor book (assumption: an investment-grade-heavy wholesale book).
  # Obligors are ranked by monthly-flow volatility (lower = better) and assigned buckets in order.
  rating_mix: {AAA: 0.03, AA: 0.07, A: 0.20, BBB: 0.35, BB: 0.20, B: 0.12, CCC: 0.03}
  lgd: {loan_secured: 0.25, loan_senior_unsecured: 0.45, bond_senior_unsecured: 0.45}  # assumptions
  loan_tenor_years: [1, 7]
  bond_tenor_years: [2, 15]
  share_secured_loans: 0.4
  share_revolvers: 0.35
  n_ust_bonds: 6
  n_irs: 24
  n_fx_forwards: 15
  n_equity_options: 12
  n_equity_trs: 8
  n_cds: 30
  equity_vol_lookback_days: 252   # realised vol for option greeks, ending at as_of
  non_us_obligor_share: 0.2       # share of obligors drawn from non-US merchant geographies
  # Merchant geography (US state code or country name) -> region tag used by scenarios.
  # US state codes map to US; anything unlisted maps to EM.
  region_map:
    United Kingdom: UK
    Germany: EUROPE
    France: EUROPE
    Italy: EUROPE
    Spain: EUROPE
    Netherlands: EUROPE
    Switzerland: EUROPE
    Greece: EUROPE
    Ireland: EUROPE
    Portugal: EUROPE
    Belgium: EUROPE
    Austria: EUROPE
    Sweden: EUROPE
    Norway: EUROPE
    Denmark: EUROPE
    Poland: EUROPE
    Russia: RUSSIA_UKRAINE
    Ukraine: RUSSIA_UKRAINE
    China: CHINA
    Taiwan: CHINA
    Hong Kong: CHINA
    Japan: JAPAN
    India: INDIA
    United Arab Emirates: MIDDLE_EAST
    Israel: MIDDLE_EAST
    Saudi Arabia: MIDDLE_EAST
    Turkey: MIDDLE_EAST
    Canada: US

severity_multiplier:            # shock = analogue shock * m(impact)
  8: 0.6
  9: 0.8
  10: 1.0
combine_concurrent: max_severity   # or "cumulative"

capital:
  cet1_ratio_start: 0.13
  # Corporate "base" risk weights by external rating: Basel Framework CRE20.42-20.43,
  # Table 10 (standardised approach, in force from 2023-01-01; verified 2026-10-02 on bis.org).
  # AAA to AA- 20%, A+ to A- 50%, BBB+ to BBB- 75%, BB+ to BB- 100%, below BB- 150%, unrated 100%.
  # (Simplification: applied to all corporate credit exposures; derivatives use the same table on
  # their credit-equivalent exposure. No SME or specialised-lending treatment.)
  risk_weights:
    AAA: 0.20
    AA: 0.20
    A: 0.50
    BBB: 0.75
    BB: 1.00
    B: 1.50
    CCC: 1.50
    UNRATED: 1.00
  # Sovereigns: CRE20.7 Table 1. AAA to AA- 0%, A+ to A- 20%, BBB+ to BBB- 50%, BB+ to B- 100%,
  # below B- 150%, unrated 100%.
  sovereign_risk_weights:
    AAA: 0.0
    AA: 0.0
    A: 0.20
    BBB: 0.50
    BB: 1.00
    B: 1.00
    CCC: 1.50
  # Listed equity holdings: CRE20.57 (250%; 400% applies only to speculative unlisted equity).
  equity_risk_weight: 2.50

stress:
  # PD multiplier for obligors whose region is tagged on the triggering event (e.g. EUROPE for a
  # European crisis), on top of the spread-implied multiplier. Assumption; shown in the explainer.
  regional_pd_factor: 1.5
  top_n_positions: 10
