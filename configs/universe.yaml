# Module A ticker universe: 20 current S&P 100 constituents (membership checked against
# the Wikipedia S&P 100 constituents table, page last edited 2026-09-27, fetched 2026-10-01).
# Selection: maximise overlap with the social dataset (equinxx stock tweets: 14 of 20 names)
# while keeping sector breadth for Module B (Financials, Energy, Health Care added).
# STATUS: proposed at GATE A, pending Arnav's OK.
#
# Fields:
#   aliases      - company names / short names matched case-insensitively
#   cashtags     - $TICKER forms (also matched from GOOG for GOOGL)
#   brands/execs - secondary aliases; execs listed are those in role during the
#                  2021-09..2022-09 replay window (a few successors included)
#   ambiguous    - aliases that need a financial/tech context or a cashtag to link

tickers:
