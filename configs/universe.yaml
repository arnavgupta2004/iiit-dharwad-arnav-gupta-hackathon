# Pseudo-entity for market-wide macro / geopolitical items (spec §5.2).
market_entity:
  ticker: MKT
  name: Market-wide
  sector: null

benchmarks:
  market: SPY

# Entity-linking settings (spec §5.2).
linking:
  # Bare uppercase tickers matched case-sensitively as words. Short or word-like tickers
  # (KO, PG, BA, DIS, GS, COST, META) are excluded because they collide with ordinary text.
  bare_tickers: [AAPL, MSFT, AMD, INTC, GOOGL, GOOG, NFLX, AMZN, TSLA, JPM, BAC, XOM, CVX, JNJ]
  bare_ticker_map: {GOOG: GOOGL}
  exec_weight: 0.5            # an exec-name hit counts as half a mention
  title_weight: 2.0           # title hits weighted x2 (spec)
  # Financial / business context. Ambiguous aliases (Apple, Amazon, Chase, Meta, ...) and ALL
  # brands (iPhone, Instagram, Tide, Marvel, ...) only link when one of these words is present
  # or another unambiguous company hit corroborates. Brand names are deliberately not listed
  # here, so a brand cannot satisfy its own context requirement.
  context_words: [shares, stock, stocks, investor, investors, earnings, revenue, revenues, sales, profit,
    profits, quarter, quarterly, ceo, cfo, chief executive, analyst, analysts, inc, corp, nasdaq, nyse,
    "s&p", "wall street", valuation, billion, acquire, acquires, acquisition, merger, lawsuit, sued,
    regulator, regulators, antitrust, fined, probe, layoffs, job cuts, guidance, outlook, dividend,
    buyback, ipo, bonds, downgrade, upgrade, price target, market cap, shareholders, subscribers,
    advertisers, ad revenue, outage, recall, tariff, sanctions, factory, deliveries]
  # Consumer how-to / shopping titles add no risk signal; company links are dropped for these.
  low_value_title_patterns: ["how to ", "how do i", "step-by-step", "tips and tricks", "screenshot",
    "wallpaper", "hands-on", "unboxing", "deal of the day", "best deals", "price cut", "coupon",
    "giveaway", "record-low price", "where to watch", "where to stream", "release date", "trailer", "recap", "spoilers"]
  # MKT pseudo-entity: macro / geopolitical / credit items without a universe company.
  mkt_classes: [GEOPOLITICAL, MACROECONOMIC, CREDIT_EVENT]
  regions:
    US: ["united states", "u.s.", " us ", america, american, washington, "federal reserve", " fed ", fomc, wall street, treasury]
    EUROPE: [europe, european, eurozone, "euro zone", ecb, germany, german, france, french, italy, italian, spain, brussels, "eu "]
    UK: [britain, british, "u.k.", " uk ", england, london, "bank of england", boe]
    RUSSIA_UKRAINE: [russia, russian, ukraine, ukrainian, kremlin, kyiv, kiev, moscow, putin, zelensky, donbas, crimea]
    CHINA: [china, chinese, beijing, shanghai, hong kong, pboc, taiwan, xi jinping]
    JAPAN: [japan, japanese, tokyo, "bank of japan", boj]
    MIDDLE_EAST: [iran, iranian, israel, saudi, opec, gulf, iraq, syria, yemen]
    INDIA: [india, indian, "new delhi", rbi]
    EM: [emerging markets, brazil, turkey, argentina, mexico, south africa]
