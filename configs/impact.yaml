# Impact score configuration (spec §5.5).
# v1 is a transparent heuristic; v2 (P1) is calibrated on an event study and must
# beat v1 and |sentiment| on held-out Spearman rho before it replaces v1.

version: v1

# Impact v2 for company mentions (D-039 revised, D-049): monotone LightGBM trained on the Benzinga
# event study (`riskpulse train impact_v2`). Market-wide items keep v1. If the model file is absent
# (e.g. a fresh clone: model files are not committed) the engine falls back to v1 and logs it.
v2:
  enabled: true
  scope: company
  model_path: data/processed/models/impact_v2.json   # JSON tree dump (engine/gbm.py)

# T: prior severity per event class, in [0, 1]. Initial values from the spec;
# documented as assumptions, to be sanity-checked against the event study.
type_prior:
  CREDIT_EVENT: 0.90
  GEOPOLITICAL: 0.80
  MACROECONOMIC: 0.75
  REGULATORY_LEGAL: 0.60
  MERGER_ACQUISITION: 0.60
  EARNINGS: 0.55
  OPERATIONAL_ESG: 0.50
  MANAGEMENT_CHANGE: 0.40
  PRODUCT_LAUNCH: 0.30
  OTHER: 0.10

# raw = T * (w_S*S + w_V*V + w_B*B + w_N*N + w_C*C) * (rel_floor + (1 - rel_floor) * R)
weights:
  sentiment: 0.35
  velocity: 0.25
  breadth: 0.15
  novelty: 0.15
  credibility: 0.10
relevance_floor: 0.5

velocity:
  window_hours: 6        # N in "mentions in last N hours"
  baseline_days: 7       # trailing baseline for the z-score (counts per N-hour bucket)
  sigmoid_scale: 1.0     # V = sigmoid(z / scale)
  min_std: 1.0           # floor on baseline std so a quiet entity's first mention is not z=inf

breadth:
  window_hours: 6
  saturation_outlets: 20 # B = log(1+n) / log(1+saturation), capped at 1

novelty:
  lookback_hours: 72

# C: source credibility (news tier above social).
credibility:
  gdelt: 0.8
  newsapi: 0.8
  kaggle_news: 0.8
  kaggle_tweets: 0.4
  reddit: 0.3
  synthetic_demo: 0.8

# Mapping raw -> 1..10 uses quantile bins fitted on the historical batch;
# bin edges are written to data/processed/impact_bins.json by the fitting step.
binning:
  method: quantile
  n_bins: 10
  # Severity scale (D-035): edges at burn-in quantiles, so 8 = top 5%, 9 = top 1%, 10 = top 0.2%.
  # Plain deciles made "impact >= 8" mean "top 30% of all items" and fired Module B ~7x/day.
  edge_quantiles: [0.15, 0.30, 0.45, 0.60, 0.72, 0.84, 0.95, 0.99, 0.998]
  # Company mentions and market-wide (MKT) items are different populations (MKT items carry
  # relevance 1 and high class priors), so each gets its own edges.
  by_population: true
  bins_path: data/processed/impact_bins.json
  # Edges are fitted on a burn-in period at the start of the replay window and applied to the
  # rest, so the Module B trigger threshold never uses future data.
  burn_in: ["2021-09-30", "2022-01-01"]
